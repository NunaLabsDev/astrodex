name = "astrodex-server"
main = "src/index.ts"
workers_dev = false
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "astrodex"
database_id = "4f7684e0-86dd-4696-b725-d7b109f4dd67"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "d086ce01143b472d920ec36ccc906668"

[[durable_objects.bindings]]
name = "DEX_INDEXER"
class_name = "DexIndexerDO"

[[services]]
binding = "ASTROWALLET"
service = "astro-wallet-server"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DexIndexerDO"]

[triggers]
crons = ["0 */6 * * *"]

